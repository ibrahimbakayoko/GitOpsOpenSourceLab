apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: prod
  namespace: argocd
spec:
  description: "Projet ArgoCD pour l'environnement de production"
  
  # Dépôts Git autorisés
  sourceRepos:
    - https://github.com/ibrahimbakayoko/GitOpsOpenSourceLab.git
  
  # Clusters et namespaces autorisés
  destinations:
    - namespace: prod
      server: https://kubernetes.default.svc
  
  # Autoriser les ressources cluster-wide si nécessaire
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
